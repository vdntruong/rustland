[package]
name = "trevo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "trevo"
path = "main.rs"

[dependencies]
chrono = "0.4.42"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
smol = "2.0.2"
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread"] }
